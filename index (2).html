<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Collection – Chapter Quiz</title>
<style>
  :root { --blue:#173f78; --light:#f2f6fc; --border:#d7dfeb; --green:#167342; --red:#b42318; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial, sans-serif; background:var(--light); color:#202938; line-height:1.5; }
  .container { max-width:900px; margin:28px auto; padding:0 16px; }
  header { background:var(--blue); color:white; padding:25px 28px; border-radius:12px; }
  header h1 { margin:0 0 6px; font-size:26px; }
  header p { margin:0; opacity:.92; }
  form, .result { background:white; margin-top:18px; padding:24px; border-radius:12px; box-shadow:0 2px 10px #142b4810; }
  .student-details { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  label.field { display:block; font-weight:600; }
  input[type=text] { width:100%; padding:11px; margin-top:6px; border:1px solid var(--border); border-radius:7px; font-size:15px; }
  fieldset { border:1px solid var(--border); border-radius:9px; padding:16px 18px; margin:18px 0; }
  legend { font-weight:700; color:var(--blue); padding:0 6px; }
  .option { display:block; padding:7px 9px; border-radius:6px; cursor:pointer; }
  .option:hover { background:#f3f7fd; }
  .option input { margin-right:8px; }
  button { border:0; border-radius:7px; padding:12px 20px; font-size:15px; font-weight:700; cursor:pointer; margin:6px 8px 6px 0; }
  .primary { background:var(--blue); color:white; }
  .secondary { background:#e8eef7; color:var(--blue); }
  .feedback { margin-top:10px; font-size:14px; }
  .correct { color:var(--green); font-weight:700; }
  .incorrect { color:var(--red); font-weight:700; }
  .result h2 { margin-top:0; color:var(--blue); }
  .score { font-size:25px; font-weight:800; }
  .muted { color:#596579; font-size:13px; }
  [hidden] { display:none !important; }
  @media(max-width:600px) { .student-details { grid-template-columns:1fr; } form,.result { padding:17px; } }
  @media print { body { background:white; } button { display:none; } form,.result { box-shadow:none; } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Chapter Quiz: Data Collection</h1>
    <p>Topics: Surveys, Sampling Bias, Confidence Intervals, Sensors and Online Data (XML)</p>
    <p class="muted" style="color:#e5edf8">20 Questions · 1 mark each · Maximum Marks: 20</p>
  </header>

  <form id="quizForm">
    <h2>Student Details</h2>
    <div class="student-details">
      <label class="field">Student Name
        <input type="text" id="studentName" required placeholder="Enter your name">
      </label>
      <label class="field">Class & Section
        <input type="text" id="studentClass" required placeholder="e.g. XI-A">
      </label>
    </div>
    <div id="questions"></div>
    <button type="submit" class="primary">Submit Quiz</button>
    <button type="reset" class="secondary">Reset Answers</button>
  </form>

  <section id="result" class="result" hidden aria-live="polite">
    <h2>Quiz Result</h2>
    <p id="studentSummary"></p>
    <p class="score" id="scoreText"></p>
    <p id="percentageText"></p>
    <div id="review"></div>
    <button type="button" class="primary" id="downloadBtn">Download Result (CSV)</button>
    <button type="button" class="secondary" onclick="window.print()">Print Result</button>
    <p class="muted">Your result is calculated in this browser. Download the CSV to save or collect the student's marks.</p>
  </section>
</div>

<script>
const quiz = [
 {q:"A survey is a research method mainly used to collect data from:",o:["Machines","People","Only websites","Weather stations"],a:1,e:"A survey collects information from people, generally through a questionnaire."},
 {q:"Which of the following is an open-ended survey question?",o:["Are you satisfied? Yes/No","Rate the service from 1 to 10","Suggest three improvements","Choose your favourite subject from the list"],a:2,e:"Open-ended questions allow respondents to answer in their own words."},
 {q:"Which is an example of a close-ended question?",o:["Write your comments","Suggest improvements","Describe your experience","Select your age group from the given options"],a:3,e:"Close-ended questions provide a fixed set of response choices."},
 {q:"Why should survey questions be carefully worded?",o:["To make the survey longer","To avoid hurting respondents' sentiments and to collect useful data","To ensure everyone gives the same answer","To remove the need for analysis"],a:1,e:"Careful wording helps make questions respectful and responses useful."},
 {q:"Sampling bias occurs when:",o:["Every member has an equal chance of selection","Some members of a population have a higher or lower chance of selection","The sample is very large","Data is collected using sensors"],a:1,e:"Sampling bias occurs when some population members are more or less likely to be selected."},
 {q:"A school surveys only members of its cricket team to find the favourite sport of all students. This is likely to cause:",o:["Sampling bias","A confidence interval","Sensor error","XML parsing"],a:0,e:"The sample over-represents students who play cricket and may not represent the whole school."},
 {q:"To reduce sampling bias, the sample should ideally be selected:",o:["Only from friends","Only from one class","Randomly, giving all population members an equal chance","Only from volunteers"],a:2,e:"Random selection helps give population members an equal chance of being selected."},
 {q:"A population is:",o:["A small group selected for a study","The entire group of interest being studied","A questionnaire","A type of sensor"],a:1,e:"The population is the complete group about which we want information."},
 {q:"A sample is:",o:["The entire population","A selection of objects or observations from a population","The final conclusion","A data visualisation"],a:1,e:"A sample is a subset selected from the population."},
 {q:"A population parameter describes:",o:["The characteristics of an entire population","Only one respondent","The wording of a question","The size of a computer screen"],a:0,e:"A population parameter is a value describing a population, such as its mean."},
 {q:"Sampling error occurs because:",o:["Every sample perfectly represents the population","Different samples from the same population can give different results","A survey has too many questions","Sensors always fail"],a:1,e:"Samples vary, so estimates from separate samples may differ."},
 {q:"A confidence interval communicates:",o:["The exact value of every population member","A range in which the population parameter is expected to lie with a stated confidence level","The number of questions in a survey","The time taken to collect data"],a:1,e:"A confidence interval gives a range around an estimate to communicate its uncertainty."},
 {q:"If the estimated mean mango weight is 250 g and the interval is ±20 g, the interval is:",o:["230 g to 270 g","250 g to 270 g","20 g to 250 g","200 g to 250 g"],a:0,e:"250 − 20 = 230 g and 250 + 20 = 270 g."},
 {q:"All other factors being equal, increasing the sample size generally makes a confidence interval:",o:["Wider","Narrower","Unchanged in every case","Impossible to calculate"],a:1,e:"A larger sample generally reduces sampling error and produces a narrower interval."},
 {q:"Greater variation or dissimilarity in a population generally leads to a confidence interval that is:",o:["Narrower","Wider","Always zero","Unaffected in every case"],a:1,e:"Greater population variation makes estimates less precise, tending to widen the interval."},
 {q:"A sensor is a device that:",o:["Only stores written reports","Detects and measures changes in a physical input and converts them into signals","Creates survey questions","Randomly selects people"],a:1,e:"Sensors detect physical changes and convert them into signals that can be interpreted."},
 {q:"In a mercury thermometer, the physical input being measured is:",o:["Sound","Temperature","Light intensity","Pressure"],a:1,e:"Temperature changes cause the mercury to expand or contract."},
 {q:"Sensor-based data collection can happen:",o:["Only when a person types the data","Continuously or when a trigger is activated","Only through questionnaires","Only once a year"],a:1,e:"Sensors may collect data continuously or when a predefined trigger occurs."},
 {q:"XML stands for:",o:["Extra Machine Learning","Extensible Markup Language","External Measurement Link","Extended Media Library"],a:1,e:"XML stands for Extensible Markup Language."},
 {q:"Which statement about XML is correct?",o:["It is used to structure and describe data using tags","It is a physical sensor","It is a type of sampling bias","It is used only to create pictures"],a:0,e:"XML organises data in a structured, tag-based format and can be used to exchange or collect online data."}
];

const questionsEl = document.getElementById("questions");
quiz.forEach((item,i) => {
  const fieldset = document.createElement("fieldset");
  const legend = document.createElement("legend");
  legend.textContent = `${i+1}. ${item.q} (1 mark)`;
  fieldset.appendChild(legend);
  item.o.forEach((option,j) => {
    const label = document.createElement("label");
    label.className = "option";
    label.innerHTML = `<input type="radio" name="q${i}" value="${j}" required> `;
    label.appendChild(document.createTextNode(option));
    fieldset.appendChild(label);
  });
  const feedback = document.createElement("div");
  feedback.className = "feedback";
  feedback.id = `feedback${i}`;
  fieldset.appendChild(feedback);
  questionsEl.appendChild(fieldset);
});

let latestResult = null;
document.getElementById("quizForm").addEventListener("submit", function(event) {
  event.preventDefault();
  let score = 0;
  const review = document.getElementById("review");
  review.innerHTML = "<h3>Answer Review</h3>";
  quiz.forEach((item,i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    const chosen = Number(selected.value);
    const isCorrect = chosen === item.a;
    if (isCorrect) score++;
    const feedback = document.getElementById(`feedback${i}`);
    feedback.className = "feedback " + (isCorrect ? "correct" : "incorrect");
    feedback.textContent = isCorrect ? "Correct." : `Incorrect. Correct answer: ${item.o[item.a]}.`;
    const p = document.createElement("p");
    p.innerHTML = `<strong>Q${i+1}:</strong> ${isCorrect ? "Correct" : "Incorrect"} — ${item.e}`;
    review.appendChild(p);
  });
  const name = document.getElementById("studentName").value.trim();
  const studentClass = document.getElementById("studentClass").value.trim();
  latestResult = {name, studentClass, score, total:quiz.length, percentage:Math.round(score/quiz.length*100)};
  document.getElementById("studentSummary").textContent = `${name} · ${studentClass}`;
  document.getElementById("scoreText").textContent = `Score: ${score} / ${quiz.length}`;
  document.getElementById("percentageText").textContent = `Percentage: ${latestResult.percentage}%`;
  document.getElementById("result").hidden = false;
  document.getElementById("result").scrollIntoView({behavior:"smooth"});
});

document.getElementById("downloadBtn").addEventListener("click", () => {
  if (!latestResult) return;
  const csv = [
    ["Student Name","Class & Section","Marks Obtained","Maximum Marks","Percentage"],
    [latestResult.name,latestResult.studentClass,latestResult.score,latestResult.total,latestResult.percentage+"%"]
  ].map(row => row.map(value => `"${String(value).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "Data_Collection_Quiz_Result.csv"; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById("quizForm").addEventListener("reset", () => {
  document.getElementById("result").hidden = true;
  latestResult = null;
  quiz.forEach((_,i) => {
    const feedback = document.getElementById(`feedback${i}`);
    feedback.textContent = ""; feedback.className = "feedback";
  });
});
</script>
</body>
</html>
